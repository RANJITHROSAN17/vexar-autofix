name: PR Guide Bot

# CI already runs the suite; a bot that re-runs it only repeats the red X. This one adds the
# thing CI cannot know: whether the change is on-plan, which acceptance criteria it is meant
# to satisfy, and whether the claims the repository publishes still reproduce.
#
# One sticky comment per PR, edited on every push. A reviewer who has to scroll past seven
# bot comments stops reading bots entirely.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-guide-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guide:
    name: Gates and roadmap context
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the gates and record each result
        id: gates
        # The bot's contract is that it always replies, so a failing gate must not skip the
        # steps that write the comment. The failure is reported, not thrown.
        continue-on-error: true
        shell: bash
        run: |
          set +e
          echo "| Gate | Result |" > gates.md
          echo "|---|---|" >> gates.md

          ruff check .
          RUFF=$?
          mypy src --strict
          MYPY=$?
          pytest
          PYTEST=$?
          python eval/run_eval.py --provider mock
          EVAL=$?

          [ $RUFF -eq 0 ] && echo "| ruff check | pass |" >> gates.md || echo "| ruff check | **fail** |" >> gates.md
          [ $MYPY -eq 0 ] && echo "| mypy --strict | pass |" >> gates.md || echo "| mypy --strict | **fail** |" >> gates.md
          [ $PYTEST -eq 0 ] && echo "| pytest | pass |" >> gates.md || echo "| pytest | **fail** |" >> gates.md
          [ $EVAL -eq 0 ] && echo "| offline eval | pass |" >> gates.md || echo "| offline eval | **fail** |" >> gates.md

          OVERALL=$(( RUFF || MYPY || PYTEST || EVAL ))
          echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"

      - name: Check the published claims still reproduce
        if: always()
        run: python .github/scripts/self_audit.py --out self_audit.md || true

      - name: Collect the changed files as data, never as script text
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed_files.txt
          wc -l < changed_files.txt

      - name: Write the PR body to a file without interpolating it
        if: always()
        env:
          # The PR body is attacker-controlled text. It is passed through the environment and
          # written by a program that never evaluates it.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python -c "import os,pathlib; pathlib.Path('pr_body.md').write_text(os.environ.get('PR_BODY') or '')"

      - name: Map the change to the roadmap
        if: always()
        run: python .github/scripts/pr_context.py --changed changed_files.txt --body pr_body.md --out context.md

      - name: Post or update the sticky comment
        if: always()
        uses: actions/github-script@v7
        env:
          OVERALL: ${{ steps.gates.outputs.overall }}
        with:
          script: |
            const fs = require('fs');
            const read = (p, fallback) => { try { return fs.readFileSync(p, 'utf8'); } catch { return fallback; } };

            const marker = '<!-- pr-guide-bot -->';
            const gates = read('gates.md', '| Gates | not run |\n|---|---|');
            const audit = read('self_audit.md', '_Self-audit did not run._');
            const context = read('context.md', '_No roadmap context generated._');
            const passed = process.env.OVERALL === '0';

            const body = [
              marker,
              `## ${passed ? 'Gates passing' : 'Gates failing'}`,
              '',
              gates.trim(),
              '',
              context.trim(),
              '',
              '### Published claims',
              '',
              audit.trim(),
              '',
              '---',
              '<sub>One comment per PR, rewritten on every push. Gates mirror CI; the roadmap '
                + 'context and the claim check are what this bot adds.</sub>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
