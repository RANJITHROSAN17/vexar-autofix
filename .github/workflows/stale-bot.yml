name: Stale Bot — Nudge, Never Close

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark idle issues and PRs stale (never close them)
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale
        uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: -1
          stale-issue-label: "stale"
          exempt-issue-labels: "pinned,roadmap,help wanted,good first issue,type/security,priority/p0"
          stale-pr-label: "stale"
          exempt-pr-labels: "pinned,dependencies,type/security"
          stale-issue-message: >
            This issue has had no activity for 60 days. It is not closed — leave a one-line
            comment if you are still working on it, or edit `.github/roadmap.json` to adjust the queue.
          stale-pr-message: >
            This pull request has had no activity for 60 days. It stays open; rebase or comment
            when ready for review.
          operations-per-run: 60
