name: Publish release to PyPI

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the published scanner and development tools
        # Fails closed until the parent release is available on PyPI. No VCS fallback.
        run: python -m pip install -e ".[dev]" build twine
      - name: Verify tag and installed version agree
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          expected = 'v' + version('vexar-autofix')
          assert os.environ['GITHUB_REF_NAME'] == expected, expected
          PY
      - name: Verify tests and mock evaluation
        run: |
          ruff check .
          mypy src --strict
          pytest
          python eval/run_eval.py --provider mock
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Prove installation from wheels with the published dependency
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/python scripts/check_release_install.py
          .release-smoke/bin/vexar-mcp --version
          .release-smoke/bin/vexar-autofix --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vexar-autofix
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
