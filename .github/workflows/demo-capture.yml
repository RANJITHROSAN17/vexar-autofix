name: Demo capture

# Regenerates the demo data that GitHub Pages renders. Runs where the API key is a secret,
# because a browser cannot hold one -- which is exactly why the Pages demo is recorded
# rather than live.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"  # Mondays, so the page does not silently rot
  push:
    branches: [main]
    paths:
      - "src/vexar_autofix/**"
      - "examples/**"
      - "scripts/capture_demo.py"
      - ".github/workflows/demo-capture.yml"

permissions:
  contents: write

concurrency:
  group: demo-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # `secrets` cannot be read from an `if:` expression -- referencing it there makes GitHub
      # reject the entire workflow before any job starts. So the secret is turned into a step
      # output first, and the branch reads that instead. Scoping the key to these steps also
      # keeps it out of the environment of checkout and setup-python.
      - name: Detect API key
        id: key
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: |
          if [ -n "$NEBIUS_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Without the secret this step is skipped rather than failing the workflow: a fork or
      # a contributor's push should not go red just because they have no key.
      - name: Capture a real run
        if: steps.key.outputs.present == 'true'
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: python scripts/capture_demo.py

      - name: Note missing secret
        if: steps.key.outputs.present == 'false'
        run: echo "NEBIUS_API_KEY secret not set; demo data left unchanged."

      - name: Commit regenerated data
        run: |
          if git diff --quiet -- docs/data/runs.json; then
            echo "demo data unchanged"
            exit 0
          fi
          git config user.name "demo-capture"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/runs.json
          git commit -m "chore(demo): refresh recorded run data"
          git push
