name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src --strict

      - name: Tests
        run: pytest

      # The eval runs against the mock, so CI never needs an API key and never spends money.
      # It still asserts the two properties that must always hold: the scanner finds exactly
      # the ground-truth rule set for every fixture, and no patch introduces a regression.
      - name: Eval (offline rehearsal)
        run: python eval/run_eval.py --provider mock

      - name: CLI smoke test
        run: |
          vexar-autofix --list-models 2>/dev/null || echo "no key in CI, skipping live model check"
          vexar-autofix --target examples/vulnerable_server.py --provider mock --no-tests | tail -20

      # Match credential *shapes*, not the string "NEBIUS_API_KEY=". A placeholder like
      # `NEBIUS_API_KEY=...` in a README is documentation, not a leak, and a check that
      # cannot tell the difference just trains people to ignore it.
      - name: Confirm no credential is committed
        run: |
          pattern='(sk-[A-Za-z0-9]{24,}|ghp_[A-Za-z0-9]{24,}|gho_[A-Za-z0-9]{24,}|github_pat_[A-Za-z0-9_]{30,}|NEBIUS_API_KEY=[A-Za-z0-9_-]{24,})'
          if git grep -nEI "$pattern" -- . ':!.github/workflows/ci.yml' ; then
            echo "::error::a credential appears to be committed"
            exit 1
          fi
          echo "no credential shapes found in tracked files"
